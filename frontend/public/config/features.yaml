# VP Investments - Feature Configuration
# Which yfinance endpoints and fields to extract per domain
# Based on: docs/yfinance_endpoints_full.md

# Stock/Meta/News
stock_meta_news:
  endpoints:
    - get_isin
    - history  # price/volume timeseries
    - get_history_metadata
    - get_dividends
    - get_splits
    - get_actions
    - get_capital_gains
    - get_shares_full
    - get_info  # comprehensive ticker metadata
    - get_fast_info  # lightweight price/volume/cap
    - get_news  # recent news articles
  
  fields:
    info:
      - currentPrice
      - previousClose
      - open
      - dayHigh
      - dayLow
      - volume
      - averageVolume
      - averageVolume10days
      - marketCap
      - fiftyTwoWeekLow
      - fiftyTwoWeekHigh
      - beta
      - trailingPE
      - forwardPE
      - dividendYield
      - exDividendDate
      - sector
      - industry
      - fullTimeEmployees
      - longBusinessSummary
      - city
      - state
      - country
      - website
    
    fast_info:
      - lastPrice
      - lastVolume
      - marketCap
      - shares
      - yearHigh
      - yearLow
      - yearChange
      - currency
      - timezone

# Financials & Events
financials_events:
  endpoints:
    - get_income_stmt  # annual
    - income_stmt
    - quarterly_income_stmt
    - ttm_income_stmt
    - get_balance_sheet  # annual
    - balance_sheet
    - quarterly_balance_sheet
    - get_cashflow  # annual
    - cashflow
    - quarterly_cashflow
    - ttm_cashflow
    - get_earnings
    - earnings
    - calendar  # upcoming earnings
    - get_earnings_dates
    - earnings_dates
    - get_sec_filings
    - sec_filings
  
  fields:
    income_stmt:
      - TotalRevenue
      - CostOfRevenue
      - GrossProfit
      - OperatingIncome
      - EBITDA
      - NetIncome
      - BasicEPS
      - DilutedEPS
      - TaxProvision
      - InterestExpense
    
    balance_sheet:
      - TotalAssets
      - TotalLiabilities
      - StockholdersEquity
      - TotalDebt
      - Cash
      - CashAndCashEquivalents
      - CurrentAssets
      - CurrentLiabilities
      - WorkingCapital
      - Goodwill
    
    cashflow:
      - OperatingCashFlow
      - CapitalExpenditures
      - FreeCashFlow
      - IssuanceOfDebt
      - RepurchaseOfCapitalStock
      - DividendsPaid

