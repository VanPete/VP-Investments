# SCORING PARAMETERS
scoring_parameters:
  # Normalization method
  normalization_method: robust_z  # options: robust_z, standard_z, minmax, rank
  
  # Winsorization (clip outliers)
  winsorize: true
  winsor_pct: 0.01  # clip at 1st and 99th percentile
  
  # Missing data handling
  missing_factor_penalty: 0.0  # score to assign if factor is null
  min_factors_required: 0.5    # minimum fraction of factors needed per group
  
  # Score bounds
  min_score: 0.0
  max_score: 1.0
  
  # Trade type weight adjustments (optional)
  trade_type_adjustments:
    growth:
      technical: 0.25
      fundamental: 0.20
      news_macro: 0.15
      social_alternative: 0.15
      risk_stability: 0.10
      institutional_smart_money: 0.15
    
    value:
      technical: 0.15
      fundamental: 0.35
      news_macro: 0.10
      social_alternative: 0.05
      risk_stability: 0.15
      institutional_smart_money: 0.20
    
    momentum:
      technical: 0.35
      fundamental: 0.10
      news_macro: 0.20
      social_alternative: 0.15
      risk_stability: 0.10
      institutional_smart_money: 0.10
    
    contrarian:
      technical: 0.15
      fundamental: 0.25
      news_macro: 0.10
      social_alternative: 0.20
      risk_stability: 0.20
      institutional_smart_money: 0.10

# VALIDATION
validation:
  # Ensure all weights sum to 1.0
  enforce_weight_sum: true
  weight_sum_tolerance: 0.001
  
  # Ensure all factors in factor_to_group.yaml have weights
  enforce_complete_coverage: true
  
  # Log warnings for unused factors
  warn_unused_factors: true
