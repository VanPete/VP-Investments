  rsi_oversold: 0.02
  macd_value: 0.03
  macd_signal: 0.02
  macd_hist: 0.04
  macd_bullish: 0.03
  bb_position: 0.02
  
  # Moving averages (16% - reduced from 18%)
  sma_20: 0.02
  sma_50: 0.03
  sma_200: 0.03
  ema_12: 0.01
  ema_26: 0.01
  price_vs_sma_50_pct: 0.03
