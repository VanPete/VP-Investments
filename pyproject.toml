[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vp-investments"
version = "3.0.0"
description = "VP Investments - Professional Investment Analysis Platform with Production Optimizations"
readme = "README.md"
authors = [
    {name = "VP Investments", email = "info@vpinvestments.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "yfinance>=0.2.0",
    "requests>=2.28.0",
    "SQLAlchemy>=1.4.0",
    "plotly>=5.11.0",
    "dash>=2.7.0",
    "python-dotenv>=0.19.0",
    "openai>=0.27.0",
    "redis>=4.3.0",
    "celery>=5.2.0",
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0",
    "pydantic>=1.10.0",
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "scikit-learn>=1.1.0",
    "ta>=0.10.0",
    "schedule>=1.2.0",
    "pytz>=2022.1",
    "python-multipart>=0.0.5",
    "jinja2>=3.1.0",
    "prometheus-client>=0.15.0",
    "structlog>=22.3.0",
    "asyncio-mqtt>=0.11.0",
    "duckdb>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
    "isort>=5.12.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
]
production = [
    "gunicorn>=20.1.0",
    "prometheus-client>=0.15.0",
    "sentry-sdk>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/vpinvestments/vp-investments"
Documentation = "https://vpinvestments.readthedocs.io"
Repository = "https://github.com/vpinvestments/vp-investments"
Issues = "https://github.com/vpinvestments/vp-investments/issues"

[project.scripts]
vp-investments = "vp_investments.cli:cli_main"
vp-api = "vp_investments.api.server:main"
vp-production = "vp_investments.production.integration:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vp_investments*"]
exclude = ["tests*", "docs*", "scripts*", "src*", "temp*"]

[tool.setuptools.package-data]
"vp_investments" = ["py.typed"]
"vp_investments.config" = ["*.yaml", "*.json"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | src
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["vp_investments"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["vp_investments"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --cov=vp_investments --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]

[tool.coverage.run]
source = ["vp_investments"]
omit = [
    "*/tests/*",
    "*/test_*",
    "vp_investments/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]